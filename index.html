<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#E6F5F3">
<title>tatochka</title>
<meta name="description" content="Все ссылки в одном месте.">
<meta property="og:type" content="website">
<meta property="og:title" content="tatochka">
<meta property="og:description" content="Все ссылки в одном месте.">
<meta property="og:image" content="assets/hero.jpg">
<link rel="icon" href="assets/lips.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

<!-- живой фон: бирюзовые и розовые пятна, блики медленно ползут -->
<div class="sea" aria-hidden="true">
  <i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i>
  <div class="caustics"></div>
</div>

<div class="scene">

  <!-- экран загрузки: губы налетают на зрителя и растворяются,
       а из-за них прилетает страница -->
  <div class="stage" id="stage">
    <div class="stage__media">
      <video id="lips" src="assets/lips.mp4"
             muted playsinline autoplay preload="auto"
             disablepictureinpicture aria-hidden="true"></video>
      <canvas id="lipsCanvas" width="1152" height="648" aria-hidden="true"></canvas>
    </div>
  </div>

  <main class="page">

    <!-- ── ФОТО: положи свой файл в assets/hero.jpg ── -->
    <header class="hero">
      <div class="hero__photo"></div>
      <div class="hero__cap">
        <h1 class="hero__name">tatochka</h1>
      </div>
    </header>

    <nav class="grid" aria-label="Ссылки">

      <a class="tile tile--wide tile--tg" href="https://t.me/podval_taty" target="_blank" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tg"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">Telegram</span>
          <span class="tile__sub">основной канал</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <a class="tile tile--cards" href="https://t.me/Berloraa" target="_blank" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tg"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">Обмен картами</span>
          <span class="tile__sub">беседа в телеграме</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <a class="tile tile--chat" href="https://t.me/psikhushkaa" target="_blank" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tg"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">Болталка</span>
          <span class="tile__sub">беседа в телеграме</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <a class="tile tile--tt" href="https://www.tiktok.com/@tata_ruu" target="_blank" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tt"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">TikTok</span>
          <span class="tile__sub">@tata_ruu</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <!-- не ссылка: открывает карточку с айди и ником -->
      <button class="tile tile--pubg" type="button" data-open="pubg">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pubg"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">PUBG Mobile</span>
          <span class="tile__sub">айди и ник</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-card"></use></svg></span>
      </button>

    </nav>

    <footer class="credit">povered by тот кого ты ненавидишь больше всего</footer>

  </main>
</div>


<!-- ── карточка PUBG ── -->
<div class="modal" id="pubg" hidden>
  <div class="modal__back" data-close></div>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="pubgTitle">
    <button class="modal__x" type="button" data-close aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"></use></svg>
    </button>

    <span class="modal__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pubg"></use></svg></span>
    <h2 class="modal__title" id="pubgTitle">PUBG Mobile</h2>
    <p class="modal__note">Добавляй по айди или ищи по нику</p>

    <div class="row">
      <span class="row__label">Айди</span>
      <span class="row__val" id="pubgId">51347745848</span>
      <button class="row__copy" type="button" data-copy="pubgId">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-copy"></use></svg>
        <span>копировать</span>
      </button>
    </div>

    <div class="row">
      <span class="row__label">Ник</span>
      <span class="row__val" id="pubgNick">ētataēē</span>
      <button class="row__copy" type="button" data-copy="pubgNick">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-copy"></use></svg>
        <span>копировать</span>
      </button>
    </div>
  </div>
</div>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-tg"><path d="M21.6 4.2 2.6 11.5c-1.1.4-1.1 2 .1 2.3l4.7 1.4 1.8 5.4c.3.9 1.4 1.1 2 .4l2.4-2.6 4.7 3.4c.7.5 1.8.1 2-.8l3.2-15c.2-1-.8-1.9-1.9-1.8zM9.5 14.7l8.4-5.4-6.8 6.3-.3 3.3z"/></g>
    <g id="i-tt"><path d="M16.9 5.8A4.5 4.5 0 0 1 15.8 3h-3.2v12.6a2.6 2.6 0 1 1-1.9-2.5V9.9a5.9 5.9 0 1 0 5.1 5.8V9.1a7.5 7.5 0 0 0 4.3 1.4V7.3a4.4 4.4 0 0 1-3.2-1.5z"/></g>
    <!-- шлем контуром: сплошной силуэт на 19 пикселях слипался в пятно,
         тонкая линия держит и купол, и визор, и нащёчники -->
    <g id="i-pubg" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.4 13.2v-2.1a6.6 6.6 0 0 1 13.2 0v2.1"/>
      <rect x="4.1" y="13.2" width="15.8" height="2.6" rx="1.1"/>
      <path d="M6.9 15.8l.5 2.3a1.2 1.2 0 0 0 1.2 1h6.8a1.2 1.2 0 0 0 1.2-1l.5-2.3"/>
      <path d="M12 4.5v8.7"/>
    </g>
    <g id="i-out"><path d="M8 16 16 8M9.5 8H16v6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><path d="M5 6h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm0 4h14M8 14h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-copy"><path d="M9 9V6.5A1.5 1.5 0 0 1 10.5 5h7A1.5 1.5 0 0 1 19 6.5v7a1.5 1.5 0 0 1-1.5 1.5H15M6.5 9h7A1.5 1.5 0 0 1 15 10.5v7A1.5 1.5 0 0 1 13.5 19h-7A1.5 1.5 0 0 1 5 17.5v-7A1.5 1.5 0 0 1 6.5 9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-check"><path d="M5 12.5 10 17.5 19 7" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-x"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></g>
  </defs>
</svg>

<script src="app.js"></script>
</body>
</html>
