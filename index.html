<body class="is-loading">

<!-- живой фон: бирюзовые и розовые пятна, блики медленно ползут -->
<div class="sea" aria-hidden="true">
  <i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i>
  <div class="caustics"></div>
</div>

  <div class="stage" id="stage">
    <div class="stage__media">
      <video id="lips" src="assets/lips.mp4"
             muted playsinline autoplay preload="auto"

      <canvas id="lipsCanvas" width="1152" height="648" aria-hidden="true"></canvas>
    </div>
  </div>

  <main class="page">

      <div class="hero__cap">
        <h1 class="hero__name">tatochka</h1>
      </div>
    </header>

    <!-- ── ССЫЛКИ: подставь свои href ── -->
    <nav class="grid" aria-label="Соцсети">

      <a class="tile tile--wide tile--tg" href="#" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tg"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">Telegram</span>
          <span class="tile__sub">основной канал</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <a class="tile tile--ig" href="#" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-ig"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">Instagram</span>
          <span class="tile__sub">фото и сторис</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <a class="tile tile--yt" href="#" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-yt"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">YouTube</span>
          <span class="tile__sub">длинные видео</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <a class="tile tile--vk" href="#" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-vk"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">ВКонтакте</span>
          <span class="tile__sub">страница</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

      <a class="tile tile--wa" href="#" rel="noopener">
        <span class="tile__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wa"></use></svg></span>
        <span class="tile__body">
          <span class="tile__title">WhatsApp</span>
          <span class="tile__sub">написать</span>
        </span>
        <span class="tile__go"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-out"></use></svg></span>
      </a>

    </nav>

    <footer class="credit">povered by тот кого ты ненавидишь больше всего</footer>

  </main>
</div>
