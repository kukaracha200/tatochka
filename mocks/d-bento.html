<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D — Бенто</title>
<link rel="stylesheet" href="mock.css">
<style>
:root{--ink:#123B40;--sub:#7B989C;--mint:#DCF4F0;--mint2:#BFEBE7;--rose:#FFE5EE;--rose2:#FFC9DC}
body{background:#FBF7F8;color:var(--ink)}
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(70% 40% at 80% 0%,#D7F4F1 0%,transparent 60%),
  radial-gradient(80% 45% at 0% 100%,#FFE3EE 0%,transparent 60%)}
.wrap{position:relative;z-index:1;padding:14px 14px 36px}

.stage{background:var(--mint);border-radius:30px;overflow:hidden}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:20px 8px 18px}
.name{font-family:var(--serif);font-size:40px;line-height:.95;font-weight:600;margin:0;letter-spacing:-.02em}
.handle{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#0E9E9C;font-weight:700;margin:0 0 5px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{
  position:relative;border-radius:24px;padding:16px;min-height:112px;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 12px 26px -18px rgba(18,59,64,.55);
  overflow:hidden;
}
.t--wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:14px;padding:18px}
.t--tg{background:var(--ink);color:#fff}
.t--ig{background:var(--rose)}
.t--yt{background:var(--mint)}
.t--vk{background:var(--mint2)}
.t--wa{background:var(--rose2)}
.t__ic{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.6)}
.t--tg .t__ic{background:rgba(255,255,255,.16)}
.t__ic svg{width:19px;height:19px;fill:currentColor}
.t b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.005em}
.t i{display:block;font-style:normal;font-size:11.5px;color:var(--sub);margin-top:2px}
.t--tg i{color:rgba(255,255,255,.6)}
.t--wide .t__body{flex:1}
.t__go{position:absolute;right:14px;top:14px;color:rgba(18,59,64,.28)}
.t--tg .t__go{color:rgba(255,255,255,.45);position:static}
.t__go svg{width:16px;height:16px}
.foot{text-align:center;margin-top:26px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#BFD3D3}
</style></head>
<body>
<div class="bg"></div>
<div class="wrap">

  <div class="stage">
    <div class="lips"><video src="../assets/lips.mp4" muted playsinline autoplay preload="auto" disablepictureinpicture aria-hidden="true"></video><canvas width="1152" height="648" aria-hidden="true"></canvas></div>
  </div>

  <div class="head">
    <h1 class="name">Лера</h1>
    <p class="handle">@lera</p>
  </div>

  <div class="grid">
    <a class="t t--wide t--tg" href="#">
      <span class="t__ic"><svg viewBox="0 0 24 24"><use href="#i-tg"/></svg></span>
      <span class="t__body"><b>Telegram</b><i>основной канал</i></span>
      <span class="t__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span>
    </a>

    <a class="t t--ig" href="#"><span class="t__ic"><svg viewBox="0 0 24 24"><use href="#i-ig"/></svg></span><span><b>Instagram</b><i>фото и сторис</i></span><span class="t__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="t t--yt" href="#"><span class="t__ic"><svg viewBox="0 0 24 24"><use href="#i-yt"/></svg></span><span><b>YouTube</b><i>длинные видео</i></span><span class="t__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="t t--vk" href="#"><span class="t__ic"><svg viewBox="0 0 24 24"><use href="#i-vk"/></svg></span><span><b>ВКонтакте</b><i>страница</i></span><span class="t__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="t t--wa" href="#"><span class="t__ic"><svg viewBox="0 0 24 24"><use href="#i-wa"/></svg></span><span><b>WhatsApp</b><i>написать</i></span><span class="t__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
  </div>

  <p class="foot">@lera</p>
</div>
<script src="icons.js"></script>
<script src="lips.js"></script>
</body></html>
