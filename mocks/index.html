<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лера — направления дизайна</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:22px 18px 26px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  background:#0E1416;color:#E8F2F1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

h1{
  font-family:ui-serif,Georgia,serif;font-weight:600;font-size:21px;
  letter-spacing:-.02em;margin:0;text-align:center;
}

/* переключатель */
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{
  appearance:none;cursor:pointer;
  display:flex;align-items:baseline;gap:7px;
  padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:#B9CFCF;font:inherit;font-size:13px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .18s,color .18s,border-color .18s;
}
.tab em{font-style:normal;font-size:10px;letter-spacing:.16em;color:#3FD0C9}
.tab:hover{background:rgba(255,255,255,.1);color:#E8F2F1}
.tab[aria-selected="true"]{
  background:#3FD0C9;border-color:#3FD0C9;color:#06282C;font-weight:600;
}
.tab[aria-selected="true"] em{color:rgba(6,40,44,.6)}

.note{
  margin:0;max-width:44ch;text-align:center;
  font-size:12.5px;line-height:1.5;color:#8FA7A9;min-height:2.8em;
}

/* трубка */
.phone{
  flex:1;min-height:420px;
  width:min(340px,92vw);
  border-radius:40px;background:#000;padding:8px;
  box-shadow:0 30px 70px -34px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.08);
}
.phone iframe{width:100%;height:100%;border:0;border-radius:33px;display:block;background:#fff}

.open{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#3FD0C9;text-decoration:none;
  border-bottom:1px solid rgba(63,208,201,.35);padding-bottom:2px;
}
</style></head>
<body>

<h1>Куда можем пойти по дизайну</h1>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-src="a-glass.html"
    data-note="Тот самый глассморфизм: матовые панели поверх бирюзово-розового свечения. Ярко и современно."><em>A</em>Светлое стекло</button>
  <button class="tab" role="tab" data-src="b-dark.html"
    data-note="Тот же приём на глубоком тёмном фоне. Губы бьют по контрасту сильнее всего, ощущение дорогого приложения."><em>B</em>Тёмное стекло</button>
  <button class="tab" role="tab" data-src="c-editorial.html"
    data-note="Белое поле, крупная антиква, тонкие линейки вместо карточек. Спокойно и дорого, без лишнего."><em>C</em>Редакция</button>
  <button class="tab" role="tab" data-src="d-bento.html"
    data-note="Плитки разного размера, пастель, крупные иконки. Живее и дружелюбнее, читается на бегу."><em>D</em>Бенто</button>
</div>

<p class="note" id="note"></p>

<div class="phone"><iframe id="frame" src="a-glass.html" title="Мок"></iframe></div>

<a class="open" id="open" href="a-glass.html" target="_blank">Открыть во всю ширину</a>

<script>
var tabs = [].slice.call(document.querySelectorAll('.tab'));
var frame = document.getElementById('frame');
var note = document.getElementById('note');
var open = document.getElementById('open');

function pick(tab) {
  tabs.forEach(function (t) { t.setAttribute('aria-selected', t === tab); });
  frame.src = tab.dataset.src;
  open.href = tab.dataset.src;
  note.textContent = tab.dataset.note;
}
tabs.forEach(function (t) { t.addEventListener('click', function () { pick(t); }); });
pick(tabs[0]);
</script>
</body></html>
