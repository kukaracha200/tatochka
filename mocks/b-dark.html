<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B — Тёмное стекло</title>
<link rel="stylesheet" href="mock.css">
<style>
body{background:#052227;color:#EAFBFA}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(64px)}
.bg .b1{width:88vw;height:88vw;top:-30vw;right:-26vw;background:radial-gradient(circle,#12C9C2,transparent 65%);opacity:.55}
.bg .b2{width:92vw;height:92vw;bottom:-32vw;left:-30vw;background:radial-gradient(circle,#FF6BA3,transparent 65%);opacity:.42}
.bg .b3{width:60vw;height:60vw;top:34%;left:34%;background:radial-gradient(circle,#0FA8A8,transparent 70%);opacity:.4}

.wrap{position:relative;z-index:1;padding:0 18px 40px}

.stage{
  margin:20px 0 24px;border-radius:34px;overflow:hidden;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
          backdrop-filter:blur(24px) saturate(150%);
}

.name{font-family:var(--serif);font-size:42px;line-height:1;font-weight:600;text-align:center;margin:0;letter-spacing:-.015em}
.handle{text-align:center;margin:10px 0 0;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#4EE0D8;font-weight:700}
.bio{text-align:center;margin:12px 0 26px;font-size:14px;color:rgba(234,251,250,.6)}

.stack{display:flex;flex-direction:column;gap:10px}
.g{
  display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
          backdrop-filter:blur(18px) saturate(150%);
}
.g--main{
  background:linear-gradient(100deg,rgba(28,214,205,.92),rgba(255,150,190,.9));
  border-color:transparent;color:#04252A;padding:17px 18px;
  box-shadow:0 16px 34px -18px rgba(28,214,205,.9)
}
.g--main .g__ic{background:rgba(255,255,255,.5);color:#04252A}
.g--main .g__t i{color:rgba(4,37,42,.62)}
.g--main .g__go{color:rgba(4,37,42,.5)}
.g__ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;
  background:rgba(255,255,255,.1);color:#6EEAE2}
.g__ic svg{width:21px;height:21px;fill:currentColor}
.g__t{flex:1;min-width:0}
.g__t b{display:block;font-size:15.5px;font-weight:650}
.g__t i{display:block;font-style:normal;font-size:12px;color:rgba(234,251,250,.5);margin-top:1px}
.g__go{color:rgba(234,251,250,.3)}
.g__go svg{width:17px;height:17px}
.foot{text-align:center;margin-top:28px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(234,251,250,.3)}
</style></head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="wrap">

  <div class="stage">
    <div class="lips"><video src="../assets/lips.mp4" muted playsinline autoplay preload="auto" disablepictureinpicture aria-hidden="true"></video><canvas width="1152" height="648" aria-hidden="true"></canvas></div>
  </div>

  <h1 class="name">Лера</h1>
  <p class="handle">@lera</p>
  <p class="bio">Снимаю, показываю, рассказываю</p>

  <div class="stack">
    <a class="g g--main" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-tg"/></svg></span><span class="g__t"><b>Telegram</b><i>основной канал</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-ig"/></svg></span><span class="g__t"><b>Instagram</b><i>фото и сторис</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-yt"/></svg></span><span class="g__t"><b>YouTube</b><i>длинные видео</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-vk"/></svg></span><span class="g__t"><b>ВКонтакте</b><i>страница</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-wa"/></svg></span><span class="g__t"><b>WhatsApp</b><i>написать напрямую</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
  </div>

  <p class="foot">@lera</p>
</div>
<script src="icons.js"></script>
<script src="lips.js"></script>
</body></html>
