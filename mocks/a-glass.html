<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A — Светлое стекло</title>
<link rel="stylesheet" href="mock.css">
<style>
:root{
  --ink:#0C3D42; --sub:#4E7C82;
}
body{background:#D8F2F0}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(38px)}
.bg .b1{width:92vw;height:92vw;top:-30vw;left:-26vw;background:radial-gradient(circle,#1FCFC6,transparent 64%)}
.bg .b2{width:98vw;height:98vw;bottom:-32vw;right:-32vw;background:radial-gradient(circle,#FF74A8,transparent 64%)}
.bg .b3{width:70vw;height:70vw;top:38%;right:-22vw;background:radial-gradient(circle,#39E0D6,transparent 66%)}
.bg .b4{width:66vw;height:66vw;top:56%;left:-24vw;background:radial-gradient(circle,#FFA9CB,transparent 66%)}

.wrap{position:relative;z-index:1;padding:0 18px 40px}

/* стекло с губами */
.glassStage{
  margin:18px 0 22px;border-radius:32px;overflow:hidden;
  background:rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 20px 50px -22px rgba(11,61,66,.45), inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
          backdrop-filter:blur(22px) saturate(170%);
}

.name{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600;text-align:center;margin:0;color:var(--ink);letter-spacing:-.015em}
.handle{text-align:center;margin:9px 0 0;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#0E9E9C;font-weight:700}
.bio{text-align:center;margin:12px 0 24px;font-size:14px;color:var(--sub)}

.stack{display:flex;flex-direction:column;gap:10px}
.g{
  display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:20px;
  background:rgba(255,255,255,.26);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 10px 26px -16px rgba(11,61,66,.5), inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(16px) saturate(170%);
          backdrop-filter:blur(16px) saturate(170%);
  color:var(--ink);
}
.g--main{padding:17px 18px;background:rgba(255,255,255,.44)}
.g__ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;
  background:rgba(255,255,255,.62);color:#0B7C7A;box-shadow:inset 0 1px 0 #fff}
.g__ic svg{width:21px;height:21px;fill:currentColor}
.g__t{flex:1;min-width:0}
.g__t b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.005em}
.g__t i{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:1px}
.g__go{color:rgba(12,61,66,.35)}
.g__go svg{width:17px;height:17px}
.foot{text-align:center;margin-top:26px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(12,61,66,.4)}
</style></head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div class="wrap">

  <div class="glassStage">
    <div class="lips"><video src="../assets/lips.mp4" muted playsinline autoplay preload="auto" disablepictureinpicture aria-hidden="true"></video><canvas width="1152" height="648" aria-hidden="true"></canvas></div>
  </div>

  <h1 class="name">Лера</h1>
  <p class="handle">@lera</p>
  <p class="bio">Снимаю, показываю, рассказываю</p>

  <div class="stack">
    <a class="g g--main" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-tg"/></svg></span><span class="g__t"><b>Telegram</b><i>основной канал</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-ig"/></svg></span><span class="g__t"><b>Instagram</b><i>фото и сторис</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-yt"/></svg></span><span class="g__t"><b>YouTube</b><i>длинные видео</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-vk"/></svg></span><span class="g__t"><b>ВКонтакте</b><i>страница</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
    <a class="g" href="#"><span class="g__ic"><svg viewBox="0 0 24 24"><use href="#i-wa"/></svg></span><span class="g__t"><b>WhatsApp</b><i>написать напрямую</i></span><span class="g__go"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></span></a>
  </div>

  <p class="foot">@lera</p>
</div>
<script src="icons.js"></script>
<script src="lips.js"></script>
</body></html>
